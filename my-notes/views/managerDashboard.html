<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="/css/bootstrap/css/bootstrap.css">
</head>



<body>
    <div class="container">
        <div class="row">

            <div class="col-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Manager Dashboard</h5>
                        <div>
                            <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#addStockModal">
                                Add Stock
                            </button>

                        </div>
                    </div>
                    <div class="card-body">
                        <h2></h2>
                        <table class="table table-striped table-h6-font" id="stockTable">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Breed</th>
                                    <th>Quantity</th>
                                    <th>Age (Days)</th>
                                    <th>Date added</th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>
                        </table>
                    </div>
                </div>

            </div>


            <!-- Add Stock Modal -->
            <div class="modal fade" id="addStockModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="addStockModal">Add New Stock</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="addStockForm">
                                <div class="form-group">
                                    <label for="chickTypeS">Chick Type</label>
                                    <select class="form-control" id="chickTypeS">
                                        <option value="">Select chick type</option>
                                        <option value="layer">Layer</option>
                                        <option value="broiler">Broiler</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="breed">Breed</label>
                                    <select class="form-control" id="breedS">
                                        <option value="">Select breed</option>
                                        <option value="local">Local</option>
                                        <option value="exotic">Exotic</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="quantityS">Quantity</label>
                                    <input type="number" class="form-control" id="quantityS">
                                </div>
                                <div class="form-group">
                                    <label for="age">Age(Days)</label>
                                    <input type="number" class="form-control" id="age">
                                </div>
                                <div class="form-group">
                                    <label for="dateUpdated">Date Updated</label>
                                    <input type="date" class="form-control" id="dateUpdated">
                                </div>

                                <button class="btn btn-primary me-2">Submit Request</button>
                                <p id="errorMsgSales" class="text-danger"></p>

                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- <script src="/js/managerScript.js"></script> -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
            <script src="/css/bootstrap/js/bootstrap.bundle.js"></script>


</body>

</html>
