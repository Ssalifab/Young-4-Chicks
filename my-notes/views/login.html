<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Young4Chicks</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="/css/bootstrap/css/bootstrap.css">
</head>

<body>

    <h1 style="color: rgb(247, 6, 6);">Welcome Back</h1>

    <div class="container"
        style="display: flex; width: 100%; max-width: 440px; margin: 0 auto; padding: 20px; box-sizing: border-box; overflow: hidden;">
        <div class="row" style="width: 100%; margin: 0; padding: 0;">
            <div class="col-12" style="text-align: left; width: 100%; padding: 0; margin: 0;">
                <h2 style="margin-top: 0;">Sign in to your Young4Chicks account</h2>
                <form id="loginForm"
                    style="display: flex; flex-direction: column; gap: 1rem; width: 100%; margin: 0; padding: 0;">
                    <div class="mb-3" style="display: flex; flex-direction: column; width: 100%;">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp" name="email"
                            style="width: 100%;">
                        <div id="emailHelp" class="form-text" style="font-size: x-small;">We'll never share your email
                            with anyone else.</div>
                    </div>
                    <div class="mb-3" style="display: flex; flex-direction: column; width: 100%;">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" style="width: 100%;">
                    </div>
                    <div class="mb-3 form-check" style="display: flex; align-items: center; gap: 0.5rem; width: 100%;">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Check me out</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-start;"> <i class="fa-solid fa-right-to-bracket"></i> Login</button>
                </form>
            </div>
        </div>
    </div>
