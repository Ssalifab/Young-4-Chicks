<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/fontawesome-free-6.7.2-web/css/all.min.css">
    <link rel="stylesheet" href="/css/bootstrap/css/bootstrap.css">
</head>

<body>
    <h1 style="color: rgb(253, 34, 34);">Customer Registration</h1>
    <div class="container"
        style="display: flex; width: 800px; max-width: min-content; margin: 0 auto; padding: 20px; box-sizing: border-box; overflow: hidden;">
        <div class="row" style="width: 100%; margin: 0; padding: 0;">
            <div class="col-8" style="text-align: left; display: 100%; padding: 0; margin-right: 0;">
                <h2>Farmer Registration Form</h2>
                <form id="farmerForm"
                    style="display: flex; flex-direction: column; gap: 1rem; width: 750px; margin-right: 0; padding: 0;">
                    <div class="form-row">
                        <div class="form-group col-md-6" style="display: flex; flex-direction: column; width: 100%;">
                            <label for="farmerName">Farmer Name *</label>
                            <input type="text" class="form-control" id="farmerName"
                                placeholder="Enter farmer full name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerEmail">Email Address *</label>
                            <input type="email" class="form-control" id="farmerEmail"
                                placeholder="Enter farmer's email address">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerPassword">Password *</label>
                            <input type="password" class="form-control" id="farmerPassword"
                                placeholder="Enter password">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerPasswordConfirm">Confirm Password *</label>
                            <input type="password" class="form-control" id="farmerPasswordConfirm"
                                placeholder="Confirm password">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerAge">Age (18-30)</label>
                            <input type="number" class="form-control" id="farmerAge" placeholder="Enter farmer age">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerGender">Gender *</label>
                            <select name="farmerGender" class="form-control" id="farmerGender">
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerNin">National ID Number *</label>
                            <input type="text" class="form-control" id="farmerNin" placeholder="Enter farmer NIN">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerContactNumber">Contact Number *</label>
                            <input type="text" class="form-control" id="farmerContactNumber"
                                placeholder="Enter farmer phone number">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerRecommender">Recommender name *</label>
                            <input type="text" class="form-control" id="farmerRecommender"
                                placeholder="Enter farmer recommender's name">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerRecommenderNin">Recommender NIN *</label>
                            <input type="text" class="form-control" id="farmerRecommenderNin"
                                placeholder="Enter recommender's NIN">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="farmerRecommenderContact">Recommender Contact *</label>
                            <input type="text" class="form-control" id="farmerRecommenderContact"
                                placeholder="Enter farmer recommender's phone number">
                        </div>

                    </div>

                    <div class="container">
                        <div class="row">
                            <div class="col-4"> <button type="button" class="btn btn-secondary" style="width: 200px;"><i class="fa-solid fa-arrow-left"></i> Back to
                                    Login</button>
                            </div>
                            <div class="col-8"><button type="submit" class="btn btn-success" style="width: 450px; margin-right: 0;"><i class="fa-solid fa-user"></i> Create Account</button></div>
                    </div>
                    <p id="errorMsgFarmer" class="text-danger"></p>
                </form>
            </div>
            <div class="col-9">
                <h2>Registered Farmers</h2>
                <table class="table table-muted table-striped" id="farmerTable">
                    <thead>
                        <tr>

                            <th>Farmer Name</th>
                            <th>Email Address</th>
                            <th>Password</th>
                            <th>Confirm Password</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>National ID Number</th>
                            <th>Contact Number</th>
                            <th>Recommender Name</th>
                            <th>Recommender NIN</th>
                            <th>Recommender Contact</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/farmerScript.js"></script>
    <script src="/css/bootstrap/js/bootstrap.bundle.js"></script>
</body>

</html>
